[package]
name = "armory"
description = "A.R.M.O.R.Y. (Arcade Runner Menu On Rails, Yeah!): a light gun friendly launcher for arcade games and tools"
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tbreckle/armory"
publish = false

# The launcher is the root package; helper tools are members with their own dependencies, which
# are only built together with them. Shared: Cargo.lock, target/ and the profiles below.
[workspace]
members = ["tools/launchbox-images"]
resolver = "3"

[dependencies]
# Slint is used under the Slint Royalty-free Desktop, Mobile, and Web Applications License 2.0,
# which requires the "Made with Slint" attribution badge (README.md) or the AboutSlint widget.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "image-default-formats",
    # Access to the winit window, to focus ARMORY when a program ends (ui::restore_window).
    "unstable-winit-030",
] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
dirs = "7.0"
anyhow = "1.0"
thiserror = "2.0"

[build-dependencies]
slint-build = "1.18"

# Embeds the icon and version info into the .exe (build.rs). Only on Windows hosts, as it needs
# the Windows SDK resource compiler.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 0              # No optimization.
debug = "line-tables-only"
strip = false              # Keep symbols.
debug-assertions = true
overflow-checks = true
incremental = true         # Faster recompilation.

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 'z'   # Optimize for size.
lto = true        # Enable Link Time Optimization.
codegen-units = 1 # Better optimization.
strip = true      # Strip symbols.
panic = 'abort'   # Smaller panic handler.
